# Server Configuration
server.port=8080

# Spring Application Name
spring.application.name=ai-medi-bot-backend

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:medibotdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Gemini API Configuration (loaded from env GEMINI_API_KEY if present)
gemini.api.key=${GEMINI_API_KEY:}
